# Prefix
set -g prefix ^A
unbind C-b
bind C-a send-prefix

# Índices e comportamento de janelas
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Terminal / cores
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Clipboard
set -g set-clipboard on

# Modo vi
setw -g mode-keys vi

# Mouse
set -g mouse on

# Status bar no topo
set -g status-position top

# Impede renomeação automática das janelas
set -g allow-rename off
setw -g automatic-rename off

# Atalho Ctrl+a a: ativa/desativa sincronização entre painéis
bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Atalhos para redimensionar painéis
bind-key C-k resize-pane -U 5
bind-key C-j resize-pane -D 5
bind-key C-h resize-pane -L 5
bind-key C-l resize-pane -R 5

# Plugins TPM
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'

# Continuum
set -g @continuum-restore 'on'

# Tema Catppuccin
set -g @catppuccin_flavor 'frappe'

# Janelas - separadores e numeração
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# Janelas - destaque ativa/inativa
set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_current_fill "all"

# Janelas - texto exibido
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status - módulos
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Status - diretório atual
set -g @catppuccin_directory_text "#{pane_current_path}"

# Inicializa TPM
run '~/.tmux/plugins/tpm/tpm'

# Reforço após carregamento dos plugins
set -g allow-rename off
setw -g automatic-rename off